*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:hidden;background:#d8ab72;color:#fff8ee;

.nav__loc{display:flex;align-items:center;gap:.3cqw}

.nav__ic{display:block;width:3cqw;height:3cqw}

.logo{position:absolute;left:50%;top:8.4cqw;width:21.8cqw;transform:translate(-50%,-50%)}

.hours{margin:5.4cqw 0 0;text-align:center;font-size:3cqw;line-height:4cqw;font-weight:600;text-transform:uppercase}
.hl{margin:3.2cqw 0 0;line-height:0}
.hl svg{display:block;width:100%;height:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ctas{display:flex;justify-content:center;gap:2.3cqw;margin-top:1.9cqw}
.btn{display:flex;align-items:center;justify-content:center;height:6.9cqw;min-height:44px;border-radius:999px;font-size:2.8cqw;line-height:1;white-space:nowrap}
.btn--fill{width:21cqw;background:#fdf7ef;color:#6a2410;font-weight:700}
.btn--line{width:20.4cqw;border:1.5px solid rgba(255,248,238,.85);color:#fff8ee;font-weight:600}
.cake{margin:1.8cqw 0 0}
.cake img{display:block;width:100%;height:auto;aspect-ratio:941/822;

  mask-image:linear-gradient(to bottom,transparent 0,#000 6%,#000 94%,transparent 100%)}
.foot{position:absolute;left:calc(4.1cqw + env(safe-area-inset-left));bottom:12.1cqw;max-width:52cqw}
.foot h2{margin:0 0 1.2cqw;font-size:3.7cqw;line-height:1.1;font-weight:800}
.foot p{margin:0;font-size:2.4cqw;line-height:3.3cqw;font-weight:600}
.year{position:absolute;right:calc(4.1cqw + env(safe-area-inset-right));bottom:14.4cqw;margin:0;font-size:3.4cqw;line-height:1;font-weight:700}
