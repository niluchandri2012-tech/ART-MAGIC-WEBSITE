<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFCF9">
<title>Art Magic — Cakes Made With Love</title>
<style>
  :root {
    --bg: #FFFCF9;
    --ink: #2A2724;
    --ink-soft: #6E6763;
    --pink: #D9486A;
    --pink-dark: #C23D5D;
    --focus: #2A2724;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* ---------- hero shell ---------- */
  .hero {
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 3vh, 26px);
    padding:
      calc(env(safe-area-inset-top, 0px) + clamp(22px, 5vh, 46px))
      clamp(20px, 6vw, 40px)
      calc(env(safe-area-inset-bottom, 0px) + clamp(20px, 4vh, 40px));
  }

  /* ---------- type block ---------- */
  .hero__head {
    text-align: center;
    max-width: 34rem;
    width: 100%;
  }

  .brand {
    margin: 0;
    font-size: clamp(15px, 4.1vw, 18px);
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .tagline {
    margin: clamp(12px, 2vh, 18px) 0 0;
    font-size: clamp(29px, 8.4vw, 42px);
    line-height: 1.08;
    font-weight: 500;
    letter-spacing: -0.022em;
    text-wrap: balance;
  }

  .lede {
    margin: clamp(10px, 1.7vh, 15px) auto 0;
    max-width: 30ch;
    font-size: clamp(14.5px, 3.8vw, 16.5px);
    line-height: 1.55;
    font-weight: 400;
    color: var(--ink-soft);
    text-wrap: balance;
  }

  /* ---------- cake ---------- */
  .hero__art {
    width: 100%;
    max-width: 382px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cake {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
  }

  /* ---------- call to action ---------- */
  .hero__cta {
    display: flex;
    justify-content: center;
    width: 100%;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 56px;
    padding: 0 clamp(24px, 6.5vw, 34px);
    border-radius: 999px;
    background: var(--pink);
    color: #ffffff;
    text-decoration: none;
    font-size: clamp(16px, 4.2vw, 17.5px);
    font-weight: 600;
    letter-spacing: 0.004em;
    box-shadow: 0 12px 26px -14px rgba(217, 72, 106, 0.75);
    -webkit-tap-highlight-color: transparent;
    transition: background-color 160ms ease, box-shadow 200ms ease, transform 160ms ease;
  }

  .btn:hover {
    background: var(--pink-dark);
    box-shadow: 0 16px 30px -14px rgba(194, 61, 93, 0.8);
    transform: translateY(-1px);
  }

  .btn:active { transform: translateY(0); }

  .btn:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  .btn__icon {
    width: 21px;
    height: 21px;
    flex: none;
    fill: currentColor;
  }

  /* ---------- entrance motion ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .rise {
      animation: am-rise 620ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    .rise--1 { animation-delay: 40ms; }
    .rise--2 { animation-delay: 110ms; }
    .rise--3 { animation-delay: 175ms; }
    .rise--4 { animation-delay: 240ms; }
    .rise--5 { animation-delay: 320ms; }
  }

  @keyframes am-rise {
    from { opacity: 0; transform: translate3d(0, 10px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }
</style>
</head>
<body>

    <h1 class="brand rise rise--1">Art Magic</h1>
    <p class="tagline rise rise--2">Cakes Made With Love</p>
    <p class="lede rise rise--3">Freshly baked celebration cakes, made to order.</p>
