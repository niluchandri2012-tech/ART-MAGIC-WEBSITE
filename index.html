<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Art Magic</title>
<style>
html,body{margin:0;height:100%;background:#fff}
.am-loader{position:fixed;inset:0;z-index:2147483000;background:#fff;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.am-safe{position:absolute;inset:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
/* Logical stage: 390 x 686, Baking/pointer row at y=343 (vertical centre). */
.am-stage{position:absolute;left:50%;top:50%;width:390px;height:686px;margin:-343px 0 0 -195px;
  transform:scale(var(--am-s,1));transform-origin:50% 50%}
.am-item{position:absolute;left:0;top:0;width:0;height:0;opacity:0;visibility:hidden;will-change:transform,opacity}
.am-ic{position:absolute;left:-31px;top:-21.5px;width:62px;height:43px;box-sizing:border-box;border-radius:22px;
  display:grid;place-items:center;background:var(--bg)}
.am-ic svg{width:26px;height:26px;fill:none;stroke:var(--fg);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.am-lab{position:absolute;left:-44px;top:0;transform:translate(-100%,-50%);white-space:nowrap}
.am-lab span{display:block;font-size:15px;line-height:1.2;font-weight:600;letter-spacing:.02em;color:#8b8b90}
.am-item.am-sel .am-ic{background:#fbe8f8;border:1.5px solid #c867b8}
.am-item.am-sel .am-lab{left:-37px}
.am-item.am-sel .am-lab span{box-sizing:border-box;width:93px;height:41px;display:grid;place-items:center;
  border:1.5px solid #dba4bd;border-radius:21px;background:#fff;color:#2f2f33;font-size:25px;font-weight:500;letter-spacing:0}
.am-ptr{position:absolute;left:275px;top:336px;width:36px;height:13px}
.am-pulse .am-sel .am-ic,.am-pulse .am-sel .am-lab span{animation:am-pulse .45s ease-in-out 1}
@keyframes am-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.am-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<script>
(function () {
  'use strict';

  /* ---- Configuration: change durations / geometry here ---- */
  var CONFIG = {
    durations: { enter: 550, descend: 850, spring: 600, hold: 450, exit: 650 }, // ms (enter+descend = one continuous travel)
    reduced: { show: 500, fade: 250 },
    failsafeMs: 8000,
    // Logical coordinate system (390 x 686), derived from the reference image
    stage: { w: 390, h: 686, maxScale: 1.25 },
    arc: { radius: 600, centerX: 831, centerY: 343, step: 0.118, selectedIndex: 3 }, // step = radians per item
    startOffset: -9,      // wheel offset (in items) at t=0: Baking far above the viewport
    overshoot: 2,         // items past the pointer
    entryLag: 0.22,       // per-item entrance stagger, in items
    hex: { targetCells: 220, overscale: 1.07, cellShare: 0.4 },
    pillOffsetX: 231      // Baking icon x on stage (for the honeycomb origin)
  };

  var ICONS = {
    sleep: '<circle cx="11" cy="13" r="7"/><path d="M8 12.2q1.2 1 2.4 0M12.6 12.2q1.2 1 2.4 0M9.6 15.6q1.4.8 2.8 0M16.5 4.5h3l-3 3.5h3"/>',
    skip: '<circle cx="12" cy="5" r="1.7"/><path d="M12 8v5M9 9.5l3 1.5 3-1.5M12 13l-2 5.5M12 13l2 5.5M7 10c-1 5 1 9.500 5 9.500s6-4.500 5-9.500"/>',
    power: '<path d="M5 17c-1-3 0-6 3-8V6l3 1 1 3c4 0 7 2 7 5 0 2-2 3-4 3H8z"/>',
    bake: '<path d="M9 3.500c3 3 3.500 8-1 11.500M9 3.500c-4 2-5 8.500 0 11.500M9 3.500c.5 4 .5 8-1 11.500M8 15l-2.500 5.500"/><rect x="12.500" y="6" width="4" height="11" rx="1.800" transform="rotate(35 14.500 11.500)"/><path d="M12 19.500l-1.500 1.500M18 4l1.500-1.500"/>',
    swim: '<circle cx="15.500" cy="7" r="1.700"/><path d="M6.500 12l4.500-2.500 4 2.500M3 16c1.500-1.500 3 1.500 4.500 0s3 1.500 4.500 0 3 1.500 4.500 0 3 1.500 4.500 0M3 20c1.500-1.500 3 1.500 4.500 0s3 1.500 4.500 0 3 1.500 4.500 0 3 1.500 4.500 0"/>',
    tennis: '<circle cx="12" cy="12" r="8"/><path d="M5.500 6.500c3.500 2.500 3.500 8.500 0 11M18.500 6.500c-3.500 2.500-3.500 8.500 0 11"/>',
    ball: '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4v16M6 6c3 3 3 9 0 12M18 6c-3 3-3 9 0 12"/>'
  };
  var ACTIVITIES = [
    { n: 'Sleep', bg: '#e6eff9', fg: '#3f86d9', i: ICONS.sleep },
    { n: 'Skipping', bg: '#fde1d6', fg: '#e9895e', i: ICONS.skip },
    { n: 'Power Training', bg: '#fbe2ea', fg: '#e0506a', i: ICONS.power },
    { n: 'Baking', bg: '#fbe8f8', fg: '#c74fb0', i: ICONS.bake },
    { n: 'Swimming', bg: '#e3eef8', fg: '#5aaee6', i: ICONS.swim },
    { n: 'Tennis', bg: '#fdf0c0', fg: '#f0c23a', i: ICONS.tennis },
    { n: 'Basketball', bg: '#eeeef6', fg: '#a99be0', i: ICONS.ball }
  ];

  var SVGNS = 'http://www.w3.org/2000/svg';
  var active = null, uid = 0;
  var clamp = function (v, a, b) { return Math.min(b, Math.max(a, v)); };
  var easeInOut = function (u) { return u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; };

  function mount(opts) {
    if (active) return active;
    opts = opts || {};
    var container = opts.container || document.body;
    var onComplete = typeof opts.onComplete === 'function' ? opts.onComplete : null;
    var D = CONFIG.durations, A = CONFIG.arc, ST = CONFIG.stage;
    var id = 'am-' + (++uid);
    var done = false, raf = 0, timers = [], resizeT = 0;
    var t0 = performance.now(), pulsing = false, exiting = false, usingClip = false;
    var cells = [], s = 1, ox = 0, oy = 0;
    var prevOverflow = document.body.style.overflow;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var root = document.createElement('div');
    root.className = 'am-loader';
    root.setAttribute('role', 'status');
    var html = '<span class="am-sr">Loading Art Magic</span><div class="am-safe" aria-hidden="true"><div class="am-stage">';
    ACTIVITIES.forEach(function (a, i) {
      html += '<div class="am-item' + (i === A.selectedIndex ? ' am-sel' : '') + '"><div class="am-lab"><span>' + a.n +
        '</span></div><div class="am-ic" style="--bg:' + a.bg + ';--fg:' + a.fg + '"><svg viewBox="0 0 24 24" focusable="false">' + a.i + '</svg></div></div>';
    });
    html += '<svg class="am-ptr" viewBox="0 0 36 13" focusable="false"><path fill="#3a3b3e" d="M0 6.500L6 1Q7 0 9 0H29.500A6.500 6.500 0 0 1 29.500 13H9Q7 13 6 12Z"/></svg></div></div>' +
      '<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><clipPath id="' + id + '-clip" clipPathUnits="userSpaceOnUse"></clipPath></defs></svg>';
    root.innerHTML = html;
    var safe = root.querySelector('.am-safe');
    var items = Array.prototype.slice.call(root.querySelectorAll('.am-item'));
    var clip = root.querySelector('clipPath');

    function layout() {
      var r = safe.getBoundingClientRect();
      s = (r.width > 0 && r.height > 0) ? Math.min(r.width / ST.w, r.height / ST.h, ST.maxScale) : 1;
      root.style.setProperty('--am-s', s.toFixed(4));
      ox = r.left + r.width / 2 + (CONFIG.pillOffsetX - ST.w / 2) * s;
      oy = r.top + r.height / 2;
    }

    function opacityAt(d) {
      var a = Math.abs(d), o = (1 - 0.1 * a) * clamp((4.6 - a) / 1.4, 0, 1);
      if (d > 2) o *= Math.max(0, 1 - 0.35 * (d - 2));
      return clamp(o, 0, 1);
    }

    function render(w, lagP) {
      var lp = easeInOut(clamp(lagP, 0, 1));
      for (var i = 0; i < items.length; i++) {
        var d = (i - A.selectedIndex) + w - CONFIG.entryLag * i * (1 - lp);
        var th = d * A.step, a = Math.abs(d);
        var x = A.centerX - A.radius * Math.cos(th), y = A.centerY + A.radius * Math.sin(th);
        var sc = Math.max(0.6, 1 - 0.16 * Math.min(a, 1) - 0.035 * Math.max(a - 1, 0));
        var rot = -(th * 180 / Math.PI) * 0.5, o = opacityAt(d), st = items[i].style;
        st.transform = 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0) rotate(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
        st.opacity = o.toFixed(3);
        st.visibility = o < 0.01 ? 'hidden' : 'visible';
      }
    }

    function buildCells() {
      var W = root.clientWidth, H = root.clientHeight;
      var r = Math.sqrt(W * H / (2.598 * CONFIG.hex.targetCells)), hw = Math.sqrt(3) * r;
      var cols = Math.ceil(W / hw) + 2, rows = Math.ceil(H / (1.5 * r)) + 2;
      while (clip.firstChild) clip.removeChild(clip.firstChild);
      var pts = [];
      for (var k = 0; k < 6; k++) {
        var ang = (60 * k - 30) * Math.PI / 180;
        pts.push((r * Math.cos(ang)).toFixed(2) + ',' + (r * Math.sin(ang)).toFixed(2));
      }
      pts = pts.join(' ');
      cells = [];
      var maxD = 1;
      for (var row = -1; row < rows; row++) {
        for (var c = -1; c < cols; c++) {
          var cx = (c + (row & 1 ? 0.5 : 0)) * hw, cy = row * 1.5 * r;
          var dist = Math.hypot(cx - ox, cy - oy);
          if (dist > maxD) maxD = dist;
          var el = document.createElementNS(SVGNS, 'polygon');
          el.setAttribute('points', pts);
          el.setAttribute('transform', 'translate(' + cx.toFixed(2) + ',' + cy.toFixed(2) + ') scale(' + CONFIG.hex.overscale + ')');
          clip.appendChild(el);
          cells.push({ el: el, cx: cx, cy: cy, dist: dist, scale: -1, fin: false });
        }
      }
      var cellDur = D.exit * CONFIG.hex.cellShare;
      cells.forEach(function (c) { c.delay = (c.dist / maxD) * (D.exit - cellDur); });
      cells.cellDur = cellDur;
    }

    function beginExit() {
      exiting = true;
      var supported = !(window.CSS && CSS.supports) || CSS.supports('clip-path', 'url(#' + id + '-clip)');
      if (!supported) { usingClip = false; root.style.transition = 'opacity ' + D.exit + 'ms ease'; root.style.opacity = '0'; return; }
      buildCells();
      root.style.clipPath = root.style.webkitClipPath = 'url(#' + id + '-clip)';
      usingClip = true;
    }

    function updateCells(te) {
      if (!usingClip) return;
      var cd = cells.cellDur;
      for (var i = 0; i < cells.length; i++) {
        var c = cells[i];
        if (c.fin) continue;
        var u = clamp((te - c.delay) / cd, 0, 1);
        var sc = u >= 1 ? 0 : CONFIG.hex.overscale * (1 - easeInOut(u));
        if (sc !== c.scale) {
          c.scale = sc;
          c.el.setAttribute('transform', 'translate(' + c.cx.toFixed(2) + ',' + c.cy.toFixed(2) + ') scale(' + sc.toFixed(3) + ')');
        }
        if (u >= 1) c.fin = true;
      }
    }

    function frame(t) {
      var travel = D.enter + D.descend, tS = travel + D.spring, tH = tS + D.hold, w, lagP = 1;
      if (t < travel) {
        var p = t / travel, e = 1 - (1 - p) * (1 - p);
        w = CONFIG.startOffset + (CONFIG.overshoot - CONFIG.startOffset) * e;
        lagP = t / D.enter;
      } else if (t < tS) {
        var tau = (t - travel) / D.spring; // damped return: one small undershoot, then settles
        w = CONFIG.overshoot * Math.exp(-4.5 * tau) * Math.cos(5.65 * tau) * (1 - tau * tau * tau);
      } else {
        w = 0; // deterministic final alignment
      }
      render(w, lagP);
      if (t >= tS && t < tH && !pulsing) { pulsing = true; root.classList.add('am-pulse'); }
      if (t >= tH) {
        if (pulsing) { pulsing = false; root.classList.remove('am-pulse'); }
        if (!exiting) beginExit();
        var te = t - tH;
        updateCells(te);
        if (te >= D.exit) finish();
      }
    }

    function tick() {
      raf = 0;
      if (done) return;
      try { frame(performance.now() - t0); }
      catch (err) { console.error('[ArtMagicLoader] animation error', err); finish(); return; }
      if (!done) raf = requestAnimationFrame(tick);
    }

    function cleanup() {
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      timers.forEach(clearTimeout); timers = [];
      clearTimeout(resizeT);
      window.removeEventListener('resize', onResize);
      window.removeEventListener('orientationchange', onResize);
      document.removeEventListener('visibilitychange', onVis);
      if (root.parentNode) root.parentNode.removeChild(root);
      document.body.style.overflow = prevOverflow;
      if (active === api) active = null;
    }

    function finish() {
      if (done) return;
      done = true;
      cleanup();
      try { if (onComplete) onComplete(); } catch (e) { console.error('[ArtMagicLoader] onComplete error', e); }
      try { document.dispatchEvent(new CustomEvent('artmagic:loader-complete')); } catch (e) { console.error(e); }
    }

    function destroy() { if (done) return; done = true; cleanup(); }

    function onResize() {
      clearTimeout(resizeT);
      resizeT = setTimeout(function () {
        if (done) return;
        layout();
        if (exiting && usingClip) { buildCells(); }
      }, 60);
    }
    function onVis() { if (!done && !document.hidden && !raf && !reduce) raf = requestAnimationFrame(tick); }

    var api = { destroy: destroy };
    active = api;
    try {
      document.body.style.overflow = 'hidden';
      container.appendChild(root);
      layout();
      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', onResize);
      document.addEventListener('visibilitychange', onVis);
      timers.push(setTimeout(function () { console.warn('[ArtMagicLoader] failsafe exit'); finish(); }, CONFIG.failsafeMs));
      if (reduce) {
        render(0, 1);
        timers.push(setTimeout(function () {
          root.style.transition = 'opacity ' + CONFIG.reduced.fade + 'ms ease';
          root.style.opacity = '0';
          timers.push(setTimeout(finish, CONFIG.reduced.fade + 20));
        }, CONFIG.reduced.show));
      } else {
        frame(0);
        raf = requestAnimationFrame(tick);
      }
    } catch (err) {
      console.error('[ArtMagicLoader] mount error', err);
      finish();
    }
    return api;
  }

  window.ArtMagicLoader = { mount: mount, destroy: function () { if (active) active.destroy(); }, config: CONFIG };
  mount({ container: document.body });
})();
</script>
</body>
</html>
